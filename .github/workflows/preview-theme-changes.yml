name: Preview Theme Changes

# Comments a WordPress Playground link on every pull request, booting the
# theme from the pull request's own branch and importing the demo content, so
# the change can be looked at instead of read. Skips pull requests that only
# touch repository tooling.
#
# The Blueprint is derived from `.github/blueprint.json` on the pull request's
# branch, with the theme install and the demo content import repointed at the
# head repository, rather than using the action's `theme-path` shortcut. The
# shortcut builds the clone URL from the event payload's repository, which is
# always the base repository, so a pull request from a fork would clone this
# repository at a branch that only exists in the contributor's fork:
# https://github.com/WordPress/action-wp-playground-pr-preview/issues/93
#
# NOTE (test harness): the "Verify the preview targets the fork" step is not
# part of the upstream pull request. It exists so this copy can prove, rather
# than assert, that the generated preview clones the fork and not the base.
# Remove it when this workflow is lifted back into a real repository.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    # Skip pull requests that only touch repository tooling: nothing there
    # changes what the theme looks like in Playground. A pull request that
    # touches both these files and the theme itself still gets a preview.
    #
    # `.github/**` is deliberately NOT ignored wholesale. The preview imports
    # `.github/ipsum-demo-content.xml`, so a change to that file does change
    # what the preview shows. Only the tooling paths are listed.
    paths-ignore:
      - '.github/workflows/**'
      - '.github/*.md'
      - '.husky/**'
      - '.gitignore'
      - '.wp-env.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: playground-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-theme-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Build the preview Blueprint from .github/blueprint.json
        id: blueprint
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "${HEAD_REPO:-}" ] || [ -z "${HEAD_REF:-}" ]; then
            echo "::error::this pull request payload has no head repository or ref"
            exit 1
          fi

          if ! curl -fsSL "https://raw.githubusercontent.com/${HEAD_REPO}/${HEAD_REF}/.github/blueprint.json" -o blueprint.json; then
            echo "No .github/blueprint.json on ${HEAD_REPO}@${HEAD_REF}; falling back to ${BASE_REPO}@${BASE_REF}"
            curl -fsSL "https://raw.githubusercontent.com/${BASE_REPO}/${BASE_REF}/.github/blueprint.json" -o blueprint.json
          fi

          jq -c --arg url "https://github.com/${HEAD_REPO}.git" \
                --arg ref "${HEAD_REF}" \
                --arg wxr "https://raw.githubusercontent.com/${HEAD_REPO}/${HEAD_REF}/.github/ipsum-demo-content.xml" \
                '.preferredVersions = {php: "8.3", wp: "nightly"}
                 | .steps = (.steps | map(
                     if .step == "installTheme" then
                       .themeData = {resource: "git:directory", url: $url, ref: $ref, path: "/"} | .options = {activate: true}
                     elif .step == "importWxr" then
                       .file = {resource: "url", url: $wxr}
                     else . end))' \
                blueprint.json > preview-blueprint.json

          if ! grep -qF "${HEAD_REPO}.git" preview-blueprint.json; then
            echo "::error::the generated Blueprint does not install the theme from ${HEAD_REPO}"
            exit 1
          fi

          echo "blueprint=$(cat preview-blueprint.json)" >> "$GITHUB_OUTPUT"

      - name: Add the WordPress Playground preview button
        id: preview
        uses: WordPress/action-wp-playground-pr-preview@1b15093d61b5e98cdfeb31466f34ade495762cd7 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: comment
          blueprint: ${{ steps.blueprint.outputs.blueprint }}

      - name: Verify the preview targets the fork
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          BASE: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "::error::the action did not expose a preview-url output"
            exit 1
          fi

          # 1. Pull the blueprint back out of the preview URL
          enc=$(python3 -c 'import sys,urllib.parse; q=urllib.parse.urlparse(sys.argv[1]).query; print(urllib.parse.parse_qs(q)["blueprint-url"][0])' "$PREVIEW_URL")
          json=$(python3 -c 'import sys,base64; d=sys.argv[1]; meta,_,payload=d.partition(","); print(base64.b64decode(payload).decode() if "base64" in meta else payload)' "$enc")
          echo "$json"

          # 2. It must clone the head repo at the head ref
          url=$(jq -r '.steps[] | select(.step=="installTheme") | .themeData.url' <<<"$json")
          ref=$(jq -r '.steps[] | select(.step=="installTheme") | .themeData.ref' <<<"$json")
          [ "$url" = "https://github.com/${HEAD_REPO}.git" ] || { echo "::error::clones $url, expected https://github.com/${HEAD_REPO}.git"; exit 1; }
          [ "$ref" = "$HEAD_REF" ] || { echo "::error::ref '$ref' != '$HEAD_REF'"; exit 1; }

          # 3. The ref must not exist in the base - that is the whole point
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${BASE}/branches/${HEAD_REF}")
          [ "$code" = "404" ] || { echo "::error::base already has '${HEAD_REF}' (HTTP $code)"; exit 1; }

          # 4. The preview URL should be reachable
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "$PREVIEW_URL")" = "200" ] || echo "::warning::preview URL not 200"

          {
            echo "### Preview verification"
            echo
            echo "| check | value |"
            echo "|---|---|"
            echo "| preview URL | $PREVIEW_URL |"
            echo "| clones | $url |"
            echo "| ref | $ref |"
            echo "| base already has this ref | no (404) |"
            echo
            echo '<details><summary>Decoded Blueprint</summary>'
            echo
            echo '```json'
            echo "$json"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
